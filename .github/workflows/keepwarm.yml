# Прогрев функции на Vercel.
#
# Замерено 2026-08-29: тёплая функция отвечает гостю за 7 секунд, холодная —
# около минуты. Разница не в модели и не в базе, а в разворачивании пакета
# функции (236 МБ) при первом запросе после простоя.
#
# Минута — это не просто медленно. Green API не дожидается ответа и присылает
# то же сообщение заново; в логах это видно как «повтор — пропускаю».
# Дедуп спасает от двойного ответа, но гость всё равно ждёт минуту.
#
# Лечится тем, что функцию не дают уснуть. Запрос дешёвый: /health не трогает
# ни модель, ни базу.
#
# ⚠️ GitHub запускает расписания с задержкой, иногда в десятки минут — как
# единственная защита этого мало. Надёжнее внешний пингер (cron-job.org,
# UptimeRobot — оба бесплатны и умеют раз в минуту). Здесь — то, что можно
# включить сразу и без сторонних сервисов.

name: Прогрев

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Разбудить бэкенд
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            https://airisresidence.kz/api/backend/health)
          echo "health → $code"
          # Падать не надо: единичный сбой прогрева не повод красить репозиторий
          # в красное. Но в логе видно, если бэкенд лежит.
          [ "$code" = "200" ] || echo "::warning::бэкенд ответил $code"

      # Заодно — разобрать уведомления Exely. Приём (/webhooks/exely) только
      # сохраняет и сразу отвечает: дольше 100 секунд Exely не ждёт и шлёт
      # повторы с интервалом до суток. Разбор — здесь, раз в пять минут.
      - name: Разобрать уведомления Exely
        continue-on-error: true
        run: |
          code=$(curl -s -o exely.json -w "%{http_code}" --max-time 120 \
            -X POST "https://airisresidence.kz/api/backend/api/webhooks/exely-process" \
            -H "X-Api-Key: ${{ secrets.WHATSAPP_WEBHOOK_SECRET }}")
          echo "exely-process → $code"; cat exely.json; echo
          [ "$code" = "200" ] || echo "::warning::разбор уведомлений Exely вернул $code"
