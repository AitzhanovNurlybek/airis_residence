# Сообщения гостям по ходу брони: подтверждение, напоминание накануне
# заезда, просьба об отзыве после выезда.
#
# Почему GitHub Actions, а не Vercel Cron: на тарифе Hobby у Vercel
# расписание ограничено одним запуском в сутки, а «завтра заезд» надо
# проверять хотя бы пару раз, чтобы бронь, созданная днём, не ждала
# следующего утра. Здесь расписание любое и бесплатно.
#
# Сам endpoint защищён секретом и умеет разбирать повторные вызовы: если
# сообщение уже ушло, второй запуск его не продублирует.

name: Сообщения гостям

on:
  schedule:
    # 10:00 и 16:00 по Алматы (UTC+5) — в тихие часы endpoint откажется
    # сам, но лишний раз будить его ночью незачем.
    - cron: "0 5 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:      # и кнопкой вручную, когда надо проверить

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      # Брони без предоплаты: раз в сутки, вместе с остальными
      # календарными поводами. Чаще незачем — бронь проверяется один раз, а
      # каждый запрос к Exely занимает почти секунду.
      - name: Проверить брони без предоплаты
        continue-on-error: true
        run: |
          code=$(curl -s -o unpaid.json -w "%{http_code}" --max-time 240             -X POST "https://airisresidence.kz/api/backend/api/webhooks/unpaid"             -H "X-Api-Key: ${{ secrets.WHATSAPP_WEBHOOK_SECRET }}")
          echo "HTTP $code"; cat unpaid.json; echo

      - name: Перенести брони для поиска по имени
        run: |
          # Порция за раз; первый полный обход займёт несколько дней запусков,
          # дальше почти мгновенно — неизменившиеся пропускаются.
          code=$(curl -s -o sync.json -w "%{http_code}" --max-time 120             -X POST "https://airisresidence.kz/api/backend/api/webhooks/sync-bookings"             -H "X-Api-Key: ${{ secrets.WHATSAPP_WEBHOOK_SECRET }}")
          echo "sync → $code"; cat sync.json; echo
          # Не роняем шаг: рассылка гостям важнее и должна пойти в любом случае.
          [ "$code" = "200" ] || echo "::warning::перенос броней вернул $code"

      - name: Разослать
        run: |
          code=$(curl -s -o response.json -w "%{http_code}" \
            --max-time 120 \
            -X POST "https://airisresidence.kz/api/backend/api/webhooks/lifecycle" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${{ secrets.WHATSAPP_WEBHOOK_SECRET }}")
          echo "HTTP $code"
          cat response.json
          echo
          # 401 значит, что секрет в GitHub разошёлся с тем, что на Vercel.
          # 503 — что секрет на сервере не настроен вовсе. И то и другое
          # надо чинить, а не проглатывать.
          if [ "$code" != "200" ]; then
            echo "::error::Рассылка не отработала, код $code"
            exit 1
          fi
