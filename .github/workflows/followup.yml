# Разговоры, оборвавшиеся на полпути.
#
# Гость спросил про номера, получил цены и пропал. Консьерж такой разговор не
# продолжит — он отвечает на сообщения, а сообщений больше нет. Этот запуск
# находит такие переписки и пишет гостю, возвращая к тому, на чём остановились.
# Не больше двух раз за разговор, и любая реплика гостя обнуляет счёт.
#
# Почему часто, а не дважды в день, как рассылка по броням: повод здесь не
# календарный, а тишина в переписке. Проверяя утром и вечером, гостю ответили
# бы к ночи — когда он уже забронировал в другом месте.
#
# Ночью точка отказывается работать сама, но будить её незачем, поэтому
# расписание ограничено дневными часами Алматы (UTC+5).
name: Дожим оборванных разговоров

on:
  schedule:
    - cron: "0 4-16 * * *"   # 09:00–21:00 по Алматы, каждый час
  workflow_dispatch:          # и кнопкой, когда надо проверить

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Написать тем, кто пропал
        run: |
          # Секрет заголовком, а не в адресе: адреса попадают в логи запусков
          # целиком, и ключ оттуда уже не отозвать незаметно.
          code=$(curl -s -o response.json -w "%{http_code}" --max-time 300 \
            -X POST "https://airisresidence.kz/api/backend/api/webhooks/followup" \
            -H "X-Api-Key: ${{ secrets.WHATSAPP_WEBHOOK_SECRET }}")
          echo "HTTP $code"
          cat response.json
          echo
          # 401 и 503 — это про настройку, а не про сбой сети. Пройти мимо них
          # молча значит месяцами не замечать, что дожим не работает.
          if [ "$code" != "200" ]; then exit 1; fi
